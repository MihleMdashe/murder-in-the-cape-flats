<style>
html,body{margin:0;padding:0;background:#0d0d0d;overflow:hidden}
.cf2-app,.cf2-app *{box-sizing:border-box;margin:0;padding:0}
.cf2-app{--red:#dd1f26;--charcoal:#0d0d0d;--white:#f0f0f0;--muted:#999;--card:#1a1a1a;--border:#2a2a2a;width:100%;height:100vh;color:var(--white);background:var(--charcoal);font-family:'Proxima Nova','proxima-nova',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;position:relative;isolation:isolate}
.cf2-app .leaflet-container{background:#0d0d0d!important}
.cf2-map-canvas{position:absolute;inset:0;z-index:0}
.cf2-overlay{position:absolute;z-index:500;pointer-events:none}
.cf2-headline{top:16px;left:16px;right:16px}
.cf2-headline h1{font-size:clamp(20px,3vw,32px);font-weight:800;color:var(--white);line-height:1.15;letter-spacing:-.01em;margin:0}
.cf2-headline p{font-size:clamp(11px,1.5vw,14px);color:var(--muted);margin-top:4px;line-height:1.4}
.cf2-year-bar{position:absolute;top:70px;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);display:flex;pointer-events:auto;z-index:700}
.cf2-year-btn{background:rgba(13,13,13,.85);border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:14px;font-weight:700;padding:8px 20px;cursor:pointer;transition:all .2s;border-radius:0}
.cf2-year-btn:first-child{border-radius:8px 0 0 8px}
.cf2-year-btn:last-child{border-radius:0 8px 8px 0}
.cf2-year-btn:hover{color:var(--white);background:#2a2a2a}
.cf2-year-btn.active{color:var(--white);background:var(--red);border-color:var(--red)}
.cf2-totals{top:16px;right:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.cf2-total-card{background:rgba(13,13,13,.85);border:1px solid var(--border);border-radius:8px;padding:7px 12px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);text-align:right}
.cf2-total-label{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:1px}
.cf2-total-value{font-size:22px;font-weight:700;color:var(--white);font-variant-numeric:tabular-nums;line-height:1.1}
.cf2-total-value.wc{color:var(--red)}
.cf2-legend{left:16px;bottom:16px;background:rgba(13,13,13,.85);border:1px solid var(--border);border-radius:8px;padding:9px 12px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.cf2-legend-title{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px;display:block}
.cf2-legend-bar{width:120px;height:8px;border-radius:4px;background:linear-gradient(to right,rgba(221,31,38,.15),rgba(221,31,38,.85));margin-bottom:3px}
.cf2-legend-ticks{display:flex;justify-content:space-between;width:120px;font-size:9px;color:var(--muted)}
.cf2-data-note{right:16px;bottom:60px;max-width:180px;font-size:10px;color:var(--muted);background:rgba(13,13,13,.85);border:1px solid var(--border);border-radius:8px;padding:7px 10px;display:none;line-height:1.4}
.cf2-credits{right:16px;bottom:16px;max-width:220px;text-align:right}
.cf2-credits p{font-size:10px;color:var(--muted);line-height:1.4;margin:0}
.cf2-credits strong{color:#bbb;font-weight:600}
.cf2-app .leaflet-popup-content-wrapper{background:var(--card);color:var(--white);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 24px rgba(0,0,0,.6)}
.cf2-app .leaflet-popup-content{margin:14px 16px;font-size:13px;line-height:1.5;min-width:220px}
.cf2-app .leaflet-popup-tip{background:var(--card);border:1px solid var(--border)}
.cf2-app .leaflet-popup-close-button{color:var(--muted);font-size:18px;padding:6px 8px}
.cf2-popup-title{font-size:15px;font-weight:700;color:var(--white);margin-bottom:2px}
.cf2-popup-district{font-size:11px;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em}
.cf2-popup-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
.cf2-popup-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:2px 6px 4px 0;border-bottom:1px solid var(--border)}
.cf2-popup-table td{padding:3px 6px 3px 0;color:#ccc;font-variant-numeric:tabular-nums}
.cf2-popup-table td:first-child{color:var(--muted)}
.cf2-popup-table .cur{color:var(--red);font-weight:700}
.cf2-popup-note{font-size:11px;color:var(--muted);line-height:1.4;padding-top:8px;border-top:1px solid var(--border);margin-top:6px}
.cf2-popup-rank{display:inline-block;font-size:10px;font-weight:700;color:var(--red);background:rgba(221,31,38,.12);padding:1px 6px;border-radius:4px;margin-left:6px}
.cf2-app .leaflet-bar a{background:var(--card);color:var(--white);border-color:var(--border)}
.cf2-app .leaflet-bar a:hover{background:#2a2a2a;color:var(--white)}
.cf2-app .leaflet-control-attribution{background:rgba(13,13,13,.7);color:#555;font-size:9px;border-radius:4px 0 0 0}
.cf2-app .leaflet-control-attribution a{color:#777}
.cf2-app .leaflet-top{top:auto;bottom:16px;left:152px}
.cf2-app .leaflet-top .leaflet-bar{border:none;box-shadow:0 2px 8px rgba(0,0,0,.5)}
@media(max-width:767px){
.cf2-app{height:auto;min-height:100vh;display:flex;flex-direction:column}
.cf2-map-canvas{position:relative;flex:1;min-height:60vh;z-index:0}
.cf2-overlay{position:relative;z-index:500;pointer-events:auto}
/* Headline: above the map, full width, no overlap */
.cf2-headline{position:relative;top:auto;left:auto;right:auto;padding:16px 14px 0}
.cf2-headline h1{font-size:20px}
.cf2-headline p{font-size:12px}
/* Year buttons: below headline, centered */
.cf2-year-bar{position:relative;top:auto;left:auto;-webkit-transform:none;transform:none;justify-content:center;padding:12px 14px 0}
.cf2-year-btn{font-size:13px;padding:8px 16px}
/* Totals: below year buttons, horizontal row */
.cf2-totals{position:relative;top:auto;left:auto;right:auto;flex-direction:row;gap:8px;justify-content:center;padding:12px 14px 0}
.cf2-total-card{padding:6px 10px;text-align:center}
.cf2-total-value{font-size:18px}
.cf2-total-label{font-size:8px}
/* Map fills remaining space */
/* Legend: bottom-left of map area, on top of map */
.cf2-legend{position:relative;left:auto;bottom:auto;max-width:fit-content;padding:10px 14px;margin:0 14px}
.cf2-legend-bar{width:90px}
.cf2-legend-ticks{width:90px}
/* Data note: above credits */
.cf2-data-note{position:relative;right:auto;bottom:auto;left:auto;max-width:100%;font-size:10px;padding:8px 14px;margin:0;text-align:left}
/* Credits: below the map, full width */
.cf2-credits{position:relative;right:auto;bottom:auto;left:auto;max-width:100%;text-align:left;padding:12px 14px 24px}
.cf2-credits p{font-size:10px}
.cf2-app .leaflet-popup-content{min-width:180px;font-size:12px}
.cf2-app .leaflet-top{bottom:10px;left:112px}
}
</style>

var CF2_NARRATIVE = {"headline":"Murder in the Cape Flats","subhead":"How police precinct murder figures changed, April to June, 2022 to 2026","credit_source":"Source: SAPS crime statistics, Q1 quarterly reports 2022/2023 to 2026/2027. Precinct boundaries: SAPS.","credit_graphic":"Graphic: Mihle Mdashe/News24","wc_provincial_murder":{"2022":994,"2023":939,"2024":1138,"2025":1148,"2026":1071},"national_totals":{"2022":6424,"2023":6228,"2024":6198,"2025":5770,"2026":5427}};

<script>
(function(){
'use strict';
var D=CF2_NARRATIVE,G=CF2_GEOJSON,MX=79,Y=['2022','2023','2024','2025','2026'],ay='2026',FL=[];
function fmt(n){if(n===null||n===undefined)return '\u2014';return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function esc(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sf(p,y){
  var c=p['murder_'+y];
  if(p.has_murder_data&&c!==null&&c!==undefined&&c>0){return{fillColor:'#dd1f26',fillOpacity:0.15+(c/MX)*0.70,color:'#dd1f26',weight:1,opacity:0.6};}
  if(p.has_murder_data&&(c===0||c===null||c===undefined)){return{fillColor:'#dd1f26',fillOpacity:c===0?0.03:0.05,color:'#dd1f26',weight:1,opacity:0.25,dashArray:'3,3'};}
  return{fillColor:'#444',fillOpacity:0.05,color:'#555',weight:0.5,opacity:0.2};
}
function pc(p,y){
  var n=p.name||p.COMPNT_NM||'Precinct',h='';
  h+='<div class="cf2-popup-title">'+esc(n);
  if(p.national_rank_2026){h+='<span class="cf2-popup-rank">#'+p.national_rank_2026+' nationally</span>';}
  h+='</div>';
  if(p.district){h+='<div class="cf2-popup-district">'+esc(p.district)+' District</div>';}
  var hasMurderRow=false,hasAttRow=false;
  for(var i=0;i<Y.length;i++){
    if(p['murder_'+Y[i]]!==null&&p['murder_'+Y[i]]!==undefined)hasMurderRow=true;
    if(p['att_murder_'+Y[i]]!==null&&p['att_murder_'+Y[i]]!==undefined)hasAttRow=true;
  }
  if(hasMurderRow||hasAttRow){
    h+='<table class="cf2-popup-table"><thead><tr><th>Year</th><th>Murders</th>';
    if(hasAttRow)h+='<th>Attempted</th>';
    h+='</tr></thead><tbody>';
    for(var i=0;i<Y.length;i++){
      var y2=Y[i],m=p['murder_'+y2],a=p['att_murder_'+y2],c=(y2===y);
      h+='<tr><td'+(c?' class="cur"':'')+'>'+y2+'</td><td'+(c?' class="cur"':'')+'>'+fmt(m)+'</td>';
      if(hasAttRow)h+='<td'+(c?' class="cur"':'')+'>'+fmt(a)+'</td>';
      h+='</tr>';
    }
    h+='</tbody></table>';
  }else{
    h+='<div class="cf2-popup-no-data">No murder data available for this precinct.</div>';
  }
  if(p.note){h+='<div class="cf2-popup-note">'+esc(p.note)+'</div>';}
  return h;
}
function um(y){
  ay=String(y);
  document.getElementById('cf2-national').textContent=fmt(D.national_totals[ay]);
  document.getElementById('cf2-wc-total').textContent=fmt(D.wc_provincial_murder[ay]);
  document.getElementById('cf2-data-note').style.display='block';
  document.querySelectorAll('.cf2-year-btn').forEach(function(b){b.classList.toggle('active',b.dataset.year===ay);});
  FL.forEach(function(it){it.layer.setStyle(sf(it.feature.properties,ay));if(it.layer.getPopup())it.layer.setPopupContent(pc(it.feature.properties,ay));});
}
var map;
function im(){
  map=L.map('cf2-map',{zoomControl:true,attributionControl:true,scrollWheelZoom:true,dragging:true,doubleClickZoom:true,touchZoom:true,minZoom:9,maxZoom:16});
  var basemap=L.maplibreGL({style:'https://tiles.openfreemap.org/styles/dark'}).addTo(map);
  var gl=L.geoJSON(G,{style:function(f){return sf(f.properties,ay);},onEachFeature:function(f,l){l.bindPopup(pc(f.properties,ay),{maxWidth:320,closeButton:true,autoPan:true});FL.push({feature:f,layer:l});}}).addTo(map);
  var db=L.latLngBounds([]);
  FL.forEach(function(it){if(it.feature.properties.has_murder_data){var b=it.layer.getBounds();if(b.isValid())db.extend(b);}});
  if(db.isValid()){map.fitBounds(db,{padding:[20,20],maxZoom:13});}else{map.fitBounds(gl.getBounds(),{padding:[20,20]});}
  window.addEventListener('resize',function(){setTimeout(function(){map.invalidateSize(false);},100);});
  setTimeout(function(){map.invalidateSize(false);},250);
}
function bt(){
  document.getElementById('cf2-title').textContent=D.headline;
  document.getElementById('cf2-subtitle').textContent=D.subhead;
  document.getElementById('cf2-credit-source').textContent=D.credit_source;
  document.getElementById('cf2-credit-graphic').textContent=D.credit_graphic;
  document.querySelectorAll('.cf2-year-btn').forEach(function(b){
    b.addEventListener('click',function(){um(b.dataset.year);});
  });
}
if(document.readyState!=='loading'){bt();im();}else{document.addEventListener('DOMContentLoaded',function(){bt();im();});}
})();
</script>
